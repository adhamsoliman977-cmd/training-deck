<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anatomy of a training deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --ink:#0B1B4F; --muted:#6B7499; --line:rgba(30,70,220,.14);
  --accent:#2453F0; --pill:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sora","Segoe UI",Arial,sans-serif;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 20px) 28px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:13px;color:var(--muted);pointer-events:none}
.top b{color:var(--ink);font-weight:600;letter-spacing:-.01em}

#ann{position:fixed;inset:0;pointer-events:none}
.an .ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.an line{stroke:var(--accent);stroke-width:1;stroke-dasharray:2 3;opacity:0;transition:opacity .6s ease var(--d)}
.an .dot{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(36,83,240,.12);opacity:0;transition:opacity .4s ease var(--d)}
.an .pill{position:absolute;transform:translate(-50%,-50%) translateY(5px);opacity:0;transition:opacity .5s ease var(--d),transform .6s cubic-bezier(.2,.8,.2,1) var(--d);background:var(--pill);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px -8px rgba(20,50,170,.25);padding:.4em .95em;border-radius:999px;font-size:var(--af,13px);font-weight:500;white-space:nowrap}
.an.on line{opacity:.55}.an.on .dot{opacity:1}
.an.on .pill{opacity:1;transform:translate(-50%,-50%)}

#cap{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);width:min(620px,calc(100% - 28px));text-align:center;cursor:default}
.meta{font-size:12px;color:var(--muted);min-height:1.2em;font-variant-numeric:tabular-nums}
#ttl{margin:.25em 0 .2em;font-size:clamp(22px,3vw,30px);font-weight:600;letter-spacing:-.02em;line-height:1.2}
#desc{margin:0 auto;max-width:50ch;font-size:clamp(13px,1.5vw,15px);line-height:1.6;color:var(--muted);min-height:3.2em}
.txt{animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}

#nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}
.tx{font:inherit;font-size:13px;background:none;border:1px solid var(--line);color:var(--ink);padding:.45em 1.2em;border-radius:999px;cursor:pointer;transition:border-color .2s,background .2s}
.tx:hover{border-color:var(--accent);background:rgba(36,83,240,.04)}
#dots{display:flex;gap:2px}
#dots button{width:20px;height:20px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;border-radius:6px}
#dots button::before{content:"";width:6px;height:6px;border-radius:3px;background:rgba(36,83,240,.2);transition:width .35s cubic-bezier(.2,.8,.2,1),background .3s}
#dots button.on::before{width:18px;background:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{z-index:6;transition:background .3s}
.top .tx{pointer-events:auto;padding:.35em 1em;font-size:12px;background:rgba(255,255,255,.7)}
.top .logo{height:44px;width:auto;display:block}
.top .ttlTop{padding-left:14px;border-left:1px solid var(--line);font-size:13px}
.top .ic{display:grid;place-items:center;width:32px;height:32px;padding:0}
.fs-out{display:none}
body.fs .fs-in{display:none} body.fs .fs-out{display:block}
.no-fs #fsBtn{display:none}

@media (max-width:640px){
  .top .ttlTop{display:none}
  .top .logo{height:34px}
}
.an .dot{font-size:0;color:#fff;display:grid;place-items:center;font-weight:600}
.an .pill b{display:none}
.an.num line{display:none}
.an.num .dot{width:17px;height:17px;margin:-8.5px 0 0 -8.5px;font-size:10px;box-shadow:0 0 0 3px rgba(36,83,240,.15)}
.an.num .pill b{display:inline-grid;place-items:center;width:17px;height:17px;margin-right:.5em;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:600}
.an.num .pill{font-size:13px}

#cap,#ann{transition:opacity .4s}
body.intro #cap{opacity:0;visibility:hidden;pointer-events:none}
body.intro .top .hint{visibility:hidden}

@media (max-width:640px){
  .top{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 10px}
  .top .hint{display:none}
  #nav{gap:6px;margin-top:8px}
  #nav .tx{padding:.4em .9em}
  #dots button{width:14px}
  #desc{font-size:13px;min-height:0}
  #ttl{font-size:21px}
  .an .pill{padding:.28em .7em}
}
@media (prefers-reduced-motion: reduce){ .txt{animation:none} .an .pill,.an line,.an .dot{transition-duration:.01s} }
</style>
</head>

/* ---------- particles ---------- */
const px = new Float32Array(N), py = new Float32Array(N), vx = new Float32Array(N), vy = new Float32Array(N);
const aX = new Float32Array(N), aY = new Float32Array(N), bX = new Float32Array(N), bY = new Float32Array(N);
const sw = new Float64Array(N), dep = new Float32Array(N).fill(1);
const ux = new Float32Array(N), uy = new Float32Array(N), uz = new Float32Array(N);
/* ---------- brain-shaped point cloud ---------- */
const fo = new Float32Array(N).fill(1);            // 1 = on a fold ridge, lower = inside a groove
const NC = Math.round(N*.84), NB = Math.round(N*.10), NS = N - NC - NB;
const GA = 2.399963229728653;
function brainPoint(i){
  if (i < NC) {                                       // cerebrum: two hemispheres with winding folds
    const y0 = 1 - 2*(i+.5)/NC, r0 = Math.sqrt(1-y0*y0), th = i*GA;
    const dx = Math.cos(th)*r0, dy = y0, dz = Math.sin(th)*r0;
    const g = Math.sin(11*dx + 3*Math.sin(7*dz)) + Math.sin(10*dy + 3*Math.sin(8*dx)) + Math.sin(12*dz + 3*Math.sin(6*dy));
    const groove = Math.exp(-g*g/.38);
    const fis = Math.exp(-((dx/.09)**2)) * Math.max(0, Math.min(1, (dy+.15)/.5));
    const r = (1 - .11*groove) * (1 - .17*fis);
    let x = dx*.7*r + Math.sign(dx)*.035, y = dy*.8*(1 - .1*dz)*r, z = dz*.98*r;
    if (y < 0) y *= .8;
    const tl = Math.exp(-(((dy+.45)/.3)**2)) * Math.exp(-(((dz-.1)/.45)**2));
    x *= 1 + .1*tl;
    ux[i] = x; uy[i] = y + .16; uz[i] = z; fo[i] = Math.max(0, 1 - .85*groove - .5*fis);
  } else if (i < NC + NB) {                           // cerebellum: small, finely striped
    const k = i - NC, y0 = 1 - 2*(k+.5)/NB, r0 = Math.sqrt(1-y0*y0), th = k*GA;
    const dx = Math.cos(th)*r0, dy = y0, dz = Math.sin(th)*r0;
    const groove = Math.exp(-(Math.sin(dy*13)**2)/.1), r = 1 - .07*groove;
    ux[i] = dx*.46*r; uy[i] = -.4 + dy*.22*r; uz[i] = -.58 + dz*.32*r; fo[i] = Math.max(0, 1 - .8*groove);
  } else {                                            // brain stem
    const k = i - NC - NB, f = (k+.5)/NS, a = k*GA, rad = .1*(1 - .2*f);
    ux[i] = Math.cos(a)*rad; uy[i] = -.35 - f*.5; uz[i] = -.3 + Math.sin(a)*rad + f*.06; fo[i] = .75;
  }
}
for (let i = 0; i < N; i++) {
  brainPoint(i); uy[i] = .1 - uy[i];   // screen y points down
  px[i] = innerWidth/2 + (Math.random()-.5)*innerWidth*1.2;
  py[i] = innerHeight/2 + (Math.random()-.5)*innerHeight*1.2;

}

/* ---------- neural network: neurons, synapses, travelling signals ---------- */
const NN = N > 2000 ? 260 : 170, neu = [], adj = [], edges = [], glow = new Float32Array(NN), pulses = [];
(function buildNet(){
  const pool = [];
  for (let i=0;i<NC+NB;i++) if (fo[i] > .55) pool.push(i);
  for (let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
  for (let j=0;j<NN && j<pool.length;j++) neu.push(pool[j]);
  const seen = new Set();
  neu.forEach((i,a)=>{
    adj[a] = adj[a] || [];
    const near = [];
    neu.forEach((k,b)=>{ if (a===b) return;
      const d = Math.hypot(ux[i]-ux[k], uy[i]-uy[k], uz[i]-uz[k]); if (d < .34) near.push([d,b]); });
    near.sort((p,q)=>p[0]-q[0]);
    near.slice(0,3).forEach(([,b])=>{
      const key = a<b ? a+'-'+b : b+'-'+a; if (seen.has(key)) return; seen.add(key);
      edges.push([a,b]); adj[a].push(b); (adj[b] = adj[b] || []).push(a);
    });
  });
})();
let netVis = 0, ob = 1, lastFire = 0, pv = 0;
function fire(a, hops){
  const nb = adj[a]; if (!nb || !nb.length || pulses.length > 60) return;
  pulses.push({a, b: nb[(Math.random()*nb.length)|0], p: 0, h: hops || (5 + (Math.random()*6|0))}); glow[a] = 1;
}

const Bar  = (x,y,w,h,o={}) => ({kind:'bar', w:o.w||.7, bbox:[x-2,y-2,w+4,h+4], draw:c=>{RR(c,x,y,w,h,h/2);c.fill();}});
const Ring = (cx,cy,r,lw=3,o={}) => ({kind:'line', w:o.w||1, bbox:[cx-r-lw-2,cy-r-lw-2,2*(r+lw+2),2*(r+lw+2)], draw:c=>{c.lineWidth=lw;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.stroke();}});
const Dot  = (cx,cy,r,o={}) => ({kind:'dot', w:o.w||.4, bbox:[cx-r-2,cy-r-2,2*r+4,2*r+4], draw:c=>{c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fill();}});
const Cu   = (bbox,fn,w=1) => ({kind:'line', w, bbox, draw:fn});

function smooth(c,P){

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function sampleEl(el){
  const [bx,by,bw,bh] = el.bbox, c = document.createElement('canvas');
  c.width = Math.ceil(bw)+4; c.height = Math.ceil(bh)+4;
  const g = c.getContext('2d'); g.translate(-bx+2,-by+2);
  g.fillStyle = g.strokeStyle = '#000'; g.lineCap = 'round'; g.lineJoin = 'round';
  el.draw(g);

  for (let y=0;y<c.height;y+=st) for (let x=0;x<c.width;x+=st)

}
function build(sc){
  const lists = sc.els.map(sampleEl);
  const ws = lists.map((l,i)=>Math.pow(Math.max(1,l.length),.62)*(sc.els[i].w||1));
  const sum = ws.reduce((a,b)=>a+b,0);
  const pts = new Float32Array(N*2); let o = 0;
  lists.forEach((l,i)=>{
    let n = i===lists.length-1 ? N-o : Math.round(N*ws[i]/sum);
    n = Math.max(0, Math.min(n, N-o)); if (!l.length) return;
    shuffle(l);
    for (let j=0;j<n;j++){
      const p = l[j % l.length], ex = j >= l.length ? 1.2 : .4;
      pts[2*o] = p[0] + (Math.random()-.5)*ex; pts[2*o+1] = p[1] + (Math.random()-.5)*ex; o++;

  for (; o<N; o++){ pts[2*o]=pts[0]; pts[2*o+1]=pts[1]; }
  const ang = new Float32Array(N);
  for (let i=0;i<N;i++) ang[i] = Math.atan2(pts[2*i+1]-450, pts[2*i]-800);
  sc.order = Array.from({length:N},(_,i)=>i).sort((a,b)=>ang[a]-ang[b]);

}

/* ---------- orb: clean Fibonacci sphere ---------- */
let ox=0, oy=0, od=1;
let rotY = 0, rotX = .38, breathe = 1, ryO = 0, rxO = 0, shX = 0, shY = 0, hv = 0, mx = -1e4, my = -1e4, mouseIn = false;
function orb(i){
  const cy = Math.cos(rotY), sy = Math.sin(rotY);
  let x = ux[i]*cy + uz[i]*sy, z = -ux[i]*sy + uz[i]*cy, y = uy[i];
  const cx = Math.cos(rotX), sx = Math.sin(rotX), y2 = y*cx - z*sx; z = y*sx + z*cx; y = y2;
  const p = 3.2/(3.2+z), r = R*breathe;
  ox = OC.x + shX + x*r*p; oy = OC.y + shY + y*r*p; od = (1 - z)/2;
}

/* ---------- motion ---------- */
let cur = 0, curMode = 0, prevMode = 0, swirl = 1, ready = false, tGo = performance.now();
let crisp = 0, crispScene = 0;
const K = reduce ? .16 : .045, D = reduce ? .62 : .82, SWF = reduce ? 0 : .014;
function step(t){
  pv += ((S[cur].blank ? 0 : 1) - pv) * .06;
  const inside = S[cur].brain && mouseIn;
  hv += ((inside ? 1 : 0) - hv) * .05;
  const nx = inside ? Math.max(-1.5, Math.min(1.5, (mx-OC.x)/R)) : 0, ny = inside ? Math.max(-1.5, Math.min(1.5, (my-OC.y)/R)) : 0;
  ryO += (nx*.6 - ryO) * .04; rxO += (-ny*.45 - rxO) * .04;
  shX += (nx*R*.06 - shX) * .06; shY += (ny*R*.06 - shY) * .06;
  rotY = Math.PI/2 + Math.sin(t*.00021)*.85 + ryO; rotX = .14 + rxO; breathe = 1 + .012*Math.sin(t*.0012) + hv*.035;
  for (let i=0;i<N;i++){
    const nw = t >= sw[i], m = nw ? curMode : prevMode;
    let tx, ty, d = 1;
    if (m === 0) {
      orb(i);
      if (hv > .01) {
        const ex = ox-mx, ey = oy-my, d2 = ex*ex+ey*ey, s = R*.3;
        const g = Math.exp(-d2/(2*s*s)) * hv * (.35 + .65*od);
        ox += ex*g*.6; oy += ey*g*.6; od = Math.min(1, od + g*.5);
      }
      tx = ox; ty = oy; d = od;
    }
    else { tx = F.x + (nw ? aX[i] : bX[i])*F.k; ty = F.y + (nw ? aY[i] : bY[i])*F.k; }
    dep[i] += (d - dep[i]) * .15;
    const dx = tx - px[i], dy = ty - py[i];
    vx[i] += dx*K - dy*SWF*swirl; vy[i] += dy*K + dx*SWF*swirl;
    vx[i] *= D; vy[i] *= D;
    const sp = vx[i]*vx[i] + vy[i]*vy[i]; if (sp > 1600) { const s = 40/Math.sqrt(sp); vx[i]*=s; vy[i]*=s; }
    px[i] += vx[i]; py[i] += vy[i];
  }
  // neural signals
  const netWant = curMode === 0 && !S[cur].blank && t > tGo + 1100 ? 1 : 0;
  netVis += netWant ? (1 - netVis)*.04 : -netVis*.2;
  ob += ((curMode === 0 ? 1 : 0) - ob)*.05;
  if (netVis > .3) {
    if (Math.random() < .05) fire((Math.random()*neu.length)|0);
    if (hv > .5 && t - lastFire > 180) {
      lastFire = t; let best = -1, bd = 140*140;
      for (let a=0;a<neu.length;a++){ const i = neu[a], ex = px[i]-mx, ey = py[i]-my, d2 = ex*ex+ey*ey; if (d2 < bd && dep[i] > .4) { bd = d2; best = a; } }
      if (best >= 0) { fire(best, 8); fire(best, 6); }
    }
  }
  for (let k=pulses.length-1;k>=0;k--){
    const q = pulses[k]; q.p += .045;
    if (q.p >= 1) {
      glow[q.b] = 1; q.h--;
      const nb = (adj[q.b] || []).filter(x=>x !== q.a);
      if (q.h <= 0 || !nb.length) { pulses.splice(k,1); continue; }
      if (Math.random() < .12 && q.h > 2) fire(q.b, q.h - 1);
      q.a = q.b; q.b = nb[(Math.random()*nb.length)|0]; q.p = 0;
    }
  }

  if (netVis < .01) pulses.length = 0;

  // crisp layer: particles condense into real, sharp slide content once they settle
  const want = (curMode === 1 && crispScene === cur && t > tGo + (reduce ? 300 : 1250)) ? 1 : 0;
  if (want) crisp = Math.min(1, crisp + 16.67/650);
  else { crisp = Math.max(0, crisp - 16.67/200); if (crisp === 0) crispScene = cur; }

const STY = { text:NAVY, sub:'#3A4A82', bar:SOFT, line:BLUE, dot:BLUE, link:BLUE };
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);

    const r = (curMode === 0 || d < .999) ? (.55 + 1.55*d*d) * (R/260 > 1 ? 1 : Math.max(.75, R/260)) : slideSize*.5 + .45;

    }

function go(n){
